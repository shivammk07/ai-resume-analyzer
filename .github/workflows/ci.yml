name: CareerPulse Java 17 & Web CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  java-maven-build-and-test:
    name: Java 17 — Checkstyle, JUnit 5, Javadoc & Tomcat WAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle Code Quality Check
        run: mvn checkstyle:check

      - name: Compile, Execute JUnit 5 + Mockito Suites & Package WAR
        run: mvn -B clean test package

      - name: Generate Javadoc Documentation
        run: mvn -B javadoc:javadoc

      - name: Upload Packaged Jakarta EE 10 WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careerpulse-jakarta-war
          path: target/careerpulse.war

  web-preview-verify:
    name: Live Preview — TypeScript, Node Tests & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Automated ATS, Benchmark & Privacy Tests
        run: npm run test

      - name: Build Production Preview Bundle
        run: npm run build
